<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sourav Mallick — data engineering, AI and intelligent systems">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2f36"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0e12" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0b0e12" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0b0e12" stop-opacity="0"/>
    </linearGradient>
    <path id="flow" d="M640 200 C 700 200 700 120 760 120 S 840 200 900 200 S 980 120 1040 120 S 1120 200 1170 200"/>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 64px; font-weight: 800; fill: #f2efe9; letter-spacing: -1.5px; }
      .tag  { font-size: 18px; fill: #9aa4b1; }
      .acc  { fill: #f5a524; }
      .lbl  { font-size: 12px; fill: #6b7683; letter-spacing: 2px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="#0b0e12"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- pipeline: ingest → transform → model → serve -->
  <use href="#flow" fill="none" stroke="#1f2a33" stroke-width="2"/>
  <use href="#flow" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 10" opacity=".5">
    <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="3s" repeatCount="indefinite"/>
  </use>
  <g fill="#2dd4bf">
    <circle r="4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="4" fill="#f5a524"><animateMotion dur="4s" begin="1.3s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4s" begin="2.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  </g>
  <g class="mono">
    <g transform="translate(760 120)"><rect x="-44" y="-16" width="88" height="32" rx="8" fill="#11161c" stroke="#2dd4bf"/><text y="5" text-anchor="middle" font-size="12" fill="#2dd4bf">ingest</text></g>
    <g transform="translate(900 200)"><rect x="-50" y="-16" width="100" height="32" rx="8" fill="#11161c" stroke="#2dd4bf"/><text y="5" text-anchor="middle" font-size="12" fill="#2dd4bf">transform</text></g>
    <g transform="translate(1040 120)"><rect x="-40" y="-16" width="80" height="32" rx="8" fill="#11161c" stroke="#f5a524"/><text y="5" text-anchor="middle" font-size="12" fill="#f5a524">model</text></g>
    <circle class="pulse" cx="1170" cy="200" r="7" fill="#f5a524"/>
  </g>

  <rect width="760" height="320" fill="url(#fade)"/>

  <g class="mono">
    <text x="60" y="88" class="lbl">~/franky1107 · SOFTWARE ENGINEER</text>
    <text x="56" y="168" class="name">Sourav Mallick<tspan class="acc cursor">_</tspan></text>
    <text x="60" y="212" class="tag">data engineering <tspan class="acc">/</tspan> AI <tspan class="acc">/</tspan> intelligent systems</text>
    <text x="60" y="262" font-size="14" fill="#6b7683">$ <tspan fill="#2dd4bf">turning raw data into things that think</tspan></text>
  </g>
</svg>
